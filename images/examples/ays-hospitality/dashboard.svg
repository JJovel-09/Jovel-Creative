ements Pending</text><text x="390" y="405">2</text><text x="55" y="440">Open Invoices</text><text x="390" y="440">1</text><text x="55" y="475">Overdue Invoices</text><text x="390" y="475">0</text></g><g font-family="Arial,sans-serif" font-size="15"><g fill="#b70000" font-weight="700"><text x="500" y="335">1</text><text x="500" y="375">2</text><text x="500" y="415">3</text><text x="500" y="455">4</text><text x="500" y="495">5</text><text x="500" y="535">6</text></g><g fill="#222" font-weight="700"><text x="650" y="335">Client</text><text x="650" y="375">Job / Service</text><text x="650" y="415">Pricing</text><text x="650" y="455">Proposal / Agreement</text><text x="650" y="495">Invoice</text><text x="650" y="535">Payment</text></g><g fill="#444"><text x="880" y="335">Create or select the client record.</text><text x="880" y="375">Add event or recurring engagement details.</text><text x="880" y="415">Enter line items, quantities and rates.</text><text x="880" y="455">Prepare client documents from confirmed job details.</text><text x="880" y="495">Create one or more invoice records.</text><text x="880" y="535">Record amount, date and method.</text></g></g><rect x="45" y="565" width="410" height="32" fill="#b70000"/><text x="55" y="587" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Job Status</text><g stroke="#e0e0e0" stroke-width="1"><path d="M45 184H1555M45 246H1555M45 304H1555M455 270V597M485 304V560"/></g></svg>